<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Джарвис</title>
<style>
:root {
  --bg: #04070c; --panel: rgba(12, 22, 34, .78); --line: rgba(110, 200, 255, .16); --text: #d6ecff; --muted: #7b93a8;
  --c: 79, 209, 255;            /* state colour (rgb), changed by JS */
  --cyan: #4fd1ff; --amber: #ffb547; --red: #ff5468; --green: #3ee6a1;
  --mono: "Cascadia Mono", Consolas, monospace; --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 42%, rgba(var(--c), .10), transparent 60%),
              repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); transition: background .6s; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.muted { color: var(--muted); }

/* ---- top bar ---- */
header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 14px 18px; z-index: 5; }
.brand { font: 600 13px var(--mono); letter-spacing: .32em; color: rgb(var(--c)); text-shadow: 0 0 12px rgba(var(--c), .6); }
#modes { display: flex; gap: 6px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
#modes button { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); background: rgba(10, 20, 30, .5); transition: .2s; }
#modes button:hover { color: var(--text); border-color: rgba(var(--c), .5); }
#modes button.on { color: #001018; background: rgb(var(--c)); border-color: transparent; box-shadow: 0 0 18px rgba(var(--c), .45); }
#modes button .auto { font-size: 10px; opacity: .8; margin-left: 4px; }
.tools { display: flex; gap: 4px; }
.tools button { width: 34px; height: 34px; border-radius: 10px; color: var(--muted); font-size: 16px; }
.tools button:hover { color: var(--text); background: rgba(255,255,255,.06); }

/* ---- telemetry strip ---- */
#tele { position: fixed; top: 58px; right: 18px; width: 210px; font: 11px var(--mono); color: var(--muted); z-index: 4; cursor: pointer; }
#tele .row { display: flex; justify-content: space-between; margin-top: 6px; }
.bar { height: 3px; background: rgba(255,255,255,.07); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: rgb(var(--c)); transition: width .6s; }
#tele .more { display: none; margin-top: 8px; line-height: 1.6; color: var(--text); }
#tele.open { z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: -11px -13px 0 0;
  width: 236px; backdrop-filter: blur(14px); }
#tele.open .more { display: block; }

/* ---- reactor + subtitles ---- */
#stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 120px; }
#reactor { width: min(46vh, 70vw); height: min(46vh, 70vw); cursor: pointer; }
#state { margin-top: 6px; font: 12px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: rgb(var(--c)); opacity: .85; }
#subs { min-height: 90px; width: min(760px, 92vw); margin-top: 18px; text-align: center; }
#subs .you { color: var(--muted); font-size: 14px; transition: opacity .8s; }
#subs .him { font-size: 19px; margin-top: 6px; transition: opacity .8s; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#subs .fade { opacity: 0; }

/* ---- omnibar ---- */
#omni { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(680px, 92vw); z-index: 6; }
#omni .box { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 16px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; backdrop-filter: blur(14px); transition: border-color .2s, box-shadow .2s; }
#omni .box:focus-within { border-color: rgba(var(--c), .55); box-shadow: 0 0 24px rgba(var(--c), .15); }
#q { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; padding: 9px 0; }
#q::placeholder { color: #536a7e; }
#omni .box button { width: 38px; height: 38px; border-radius: 11px; font-size: 17px; color: var(--muted); }
#omni .box button:hover { background: rgba(255,255,255,.07); color: var(--text); }
#mic.on { color: #001018 !important; background: rgb(var(--c)) !important; }
#sugg { margin-bottom: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); overflow: hidden; display: none; }
#sugg.show { display: block; }
#sugg div { padding: 9px 16px; cursor: pointer; display: flex; justify-content: space-between; }
#sugg div.sel, #sugg div:hover { background: rgba(var(--c), .12); }
#sugg kbd { font: 12px var(--mono); color: var(--muted); }
.hint { text-align: center; font-size: 11px; color: #4d6273; margin-top: 7px; font-family: var(--mono); }

/* ---- cards ---- */
#cards { position: fixed; right: 18px; top: 150px; bottom: 110px; width: 300px; display: flex; flex-direction: column; gap: 10px; z-index: 3; overflow: hidden; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid rgb(var(--c)); border-radius: var(--r); padding: 12px 14px;
  backdrop-filter: blur(12px); animation: in .35s ease; transition: opacity .5s, transform .5s; flex-shrink: 0; }
.card.out { opacity: 0; transform: translateX(30px); }
.card h4 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: rgb(var(--c)); display: flex; justify-content: space-between; }
.card h4 button { color: var(--muted); font-size: 13px; }
.card .li { display: flex; gap: 8px; justify-content: space-between; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.04); font-size: 14px; }
.card .li:first-of-type { border-top: 0; }
.chip { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.chip.over { color: var(--red); } .chip.today { color: var(--amber); }
@keyframes in { from { opacity: 0; transform: translateX(30px); } }

/* ---- drawers ---- */
.drawer { position: fixed; top: 0; bottom: 0; width: min(400px, 92vw); background: rgba(8, 14, 22, .96); border: 0 solid var(--line); z-index: 10;
  padding: 20px; overflow-y: auto; transition: transform .3s ease; backdrop-filter: blur(16px); }
#settings { right: 0; border-left-width: 1px; transform: translateX(105%); }
#history { left: 0; border-right-width: 1px; transform: translateX(-105%); }
.drawer.open { transform: none !important; }
.drawer h3 { margin: 0 0 4px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.drawer h5 { margin: 22px 0 8px; font: 600 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.sw { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; cursor: pointer; }
.sw input { display: none; }
.sw .t { width: 34px; height: 20px; border-radius: 10px; background: #233140; position: relative; flex-shrink: 0; margin-top: 2px; transition: .2s; }
.sw .t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #8aa0b4; transition: .2s; }
.sw input:checked + .t { background: rgb(var(--c)); }
.sw input:checked + .t::after { left: 17px; background: #001018; }
.sw small { display: block; color: var(--muted); font-size: 12px; }
select { width: 100%; background: #0e1824; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; }
.link { display: block; margin-top: 18px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); text-decoration: none; text-align: center; }
.link:hover { border-color: rgba(var(--c), .6); }
.msg { padding: 8px 0; border-top: 1px solid rgba(255,255,255,.05); font-size: 14px; }
.msg.user { color: var(--muted); }
.msg .meta { font: 11px var(--mono); color: #4d6273; }
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; display: none; }
#scrim.show { display: block; }
#toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 8px 16px;
  border-radius: 12px; font-size: 13px; opacity: 0; transition: .3s; z-index: 20; pointer-events: none; }
#toast.show { opacity: 1; }
@media (max-width: 900px) { #cards { display: none; } #tele { display: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">J.A.R.V.I.S</div>
  <div id="modes"></div>
  <div class="tools">
    <button id="histBtn" title="История разговора (Ctrl+H)">🕘</button>
    <button id="setBtn" title="Настройки режима (Ctrl+,)">⚙</button>
    <button onclick="location.href='/classic'" title="Все разделы: дела, заметки, подключения…">☰</button>
  </div>
</header>

<div id="tele" title="Нажмите — подробности">
  <div class="row"><span>VRAM</span><span id="tVram">—</span></div><div class="bar"><i id="bVram" style="width:0"></i></div>
  <div class="row"><span>CPU</span><span id="tCpu">—</span></div><div class="bar"><i id="bCpu" style="width:0"></i></div>
  <div class="more" id="tMore"></div>
</div>

<div id="stage">
  <canvas id="reactor" title="Нажмите, чтобы сказать команду"></canvas>
  <div id="state">запуск</div>
  <div id="subs"><div class="you" id="you"></div><div class="him" id="him"></div></div>
</div>

<div id="cards"></div>

<div id="omni">
  <div id="sugg"></div>
  <div class="box">
    <input id="q" autocomplete="off" placeholder="Скажите «Джарвис» или напишите…  / — разделы">
    <button id="mic" title="Говорить (как «Эй, Джарвис»)">🎙</button>
    <button id="hush" title="Замолчать">⏹</button>
  </div>
  <div class="hint">Enter — выполнить · / — разделы · Ctrl+K — сюда · Esc — закрыть</div>
</div>

<div id="scrim"></div>
<aside class="drawer" id="history"><h3>История <button onclick="closeAll()">✕</button></h3><div id="histList"></div></aside>
<aside class="drawer" id="settings"><h3><span id="setTitle">Режим</span> <button onclick="closeAll()">✕</button></h3><div id="setBody"></div></aside>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }
const store = { get(k, d) { try { const v = localStorage.getItem("hud." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("hud." + k, JSON.stringify(v)); } catch {} } };

// ================= state colours =================
const LOOK = {
  starting:  { c: "120,140,160", t: "запуск" },
  listening: { c: "79,209,255",  t: "жду «Джарвис»" },
  recording: { c: "79,209,255",  t: "слушаю вас" },
  thinking:  { c: "255,181,71",  t: "думаю" },
  speaking:  { c: "120,170,255", t: "говорю" },
  taping:    { c: "255,84,104",  t: "● идёт запись" },
  game:      { c: "62,230,161",  t: "игровой режим" },
};
let status = "starting", game = false;
function setStatus(s) {
  status = s || status;
  const look = game && status === "listening" ? LOOK.game : (LOOK[status] || LOOK.listening);
  document.documentElement.style.setProperty("--c", look.c);
  $("#state").textContent = look.t;
  $("#mic").classList.toggle("on", status === "recording");
}

// ================= reactor =================
const cv = $("#reactor"), g = cv.getContext("2d");
let lvTarget = 0, lv = 0, lastFrame = 0;
function fit() { const d = devicePixelRatio || 1, r = cv.getBoundingClientRect(); cv.width = r.width * d; cv.height = r.height * d; }
addEventListener("resize", fit); fit();
function draw(t) {
  requestAnimationFrame(draw);
  const busy = status !== "listening" || lv > .03;
  if (!busy && t - lastFrame < 50) return;          // idle: ~20 fps is plenty
  lastFrame = t;
  const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * .46, s = t / 1000;
  const C = getComputedStyle(document.documentElement).getPropertyValue("--c").trim();
  const col = (a) => `rgba(${C},${a})`;
  let target = lvTarget;
  if (status === "speaking") target = .35 + .25 * Math.sin(s * 9) * Math.sin(s * 3.3);
  if (status === "thinking") target = .12;
  lv += (target - lv) * .25;
  g.clearRect(0, 0, W, H);
  g.lineCap = "round";
  // outer ticks
  const spin = status === "thinking" ? s * .9 : s * .08;
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * Math.PI * 2 + spin, long = i % 6 === 0;
    g.strokeStyle = col(long ? .55 : .18); g.lineWidth = long ? 2.2 : 1.2;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * R * (long ? .9 : .93), cy + Math.sin(a) * R * (long ? .9 : .93));
    g.lineTo(cx + Math.cos(a) * R * .97, cy + Math.sin(a) * R * .97); g.stroke();
  }
  // rotating arcs
  [[.82, .7, 1.1, 3], [.74, -1.2, .7, 2], [.66, 2.1, 1.6, 1.5]].forEach(([rr, sp, len, w], i) => {
    const k = status === "thinking" ? 3 : 1, a0 = s * sp * k * .6 + i;
    g.strokeStyle = col(.5 - i * .1); g.lineWidth = w * (devicePixelRatio || 1);
    g.beginPath(); g.arc(cx, cy, R * rr, a0, a0 + len); g.stroke();
    g.beginPath(); g.arc(cx, cy, R * rr, a0 + Math.PI, a0 + Math.PI + len * .5); g.stroke();
  });
  // voice wave ring
  g.strokeStyle = col(.85); g.lineWidth = 2 * (devicePixelRatio || 1); g.shadowColor = col(.9); g.shadowBlur = 18;
  g.beginPath();
  for (let i = 0; i <= 160; i++) {
    const a = i / 160 * Math.PI * 2;
    const n = Math.sin(a * 6 + s * 4) * .5 + Math.sin(a * 11 - s * 6.3) * .3 + Math.sin(a * 3 + s * 2.1) * .2;
    const r = R * (.5 + .004 + lv * .16 * n + .006 * Math.sin(a * 4 + s));
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath(); g.stroke(); g.shadowBlur = 0;
  // core
  const cr = R * (.3 + lv * .07);
  const grd = g.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.6);
  grd.addColorStop(0, "rgba(255,255,255,.95)"); grd.addColorStop(.18, col(.95)); grd.addColorStop(.55, col(.25)); grd.addColorStop(1, col(0));
  g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, cr * 1.6, 0, Math.PI * 2); g.fill();
  g.strokeStyle = col(.7); g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, cr * .62, 0, Math.PI * 2); g.stroke();
}
requestAnimationFrame(draw);
cv.onclick = () => api("/api/listen", "POST");

// ================= subtitles =================
let subTimer;
function sub(role, text) {
  const el = role === "user" ? $("#you") : $("#him");
  el.textContent = role === "user" ? "— " + text : text;
  el.classList.remove("fade");
  if (role === "user") $("#him").classList.add("fade");
  clearTimeout(subTimer);
  subTimer = setTimeout(() => { $("#you").classList.add("fade"); $("#him").classList.add("fade"); }, role === "user" ? 20000 : 14000);
}

// ================= cards =================
const cards = new Map();
function card(id, title, html, ttl = 16000) {
  let el = cards.get(id);
  if (!el) {
    el = document.createElement("div"); el.className = "card";
    el.onmouseenter = () => clearTimeout(el._t);
    el.onmouseleave = () => arm(el, id, 6000);
    $("#cards").prepend(el); cards.set(id, el);
    while (cards.size > 4) { const [k] = cards.keys(); drop(k); }
  }
  el.innerHTML = `<h4>${esc(title)}<button title="Закрыть" onclick="drop('${id}')">✕</button></h4>${html}`;
  el.classList.remove("out");
  arm(el, id, ttl);
}
function arm(el, id, ttl) { clearTimeout(el._t); if (ttl) el._t = setTimeout(() => drop(id), ttl); }
function drop(id) { const el = cards.get(id); if (!el) return; cards.delete(id); el.classList.add("out"); setTimeout(() => el.remove(), 500); }
window.drop = drop;

function dueChip(due) {
  if (!due) return "";
  const d = new Date(due), now = new Date();
  const cls = d < now ? "over" : d.toDateString() === now.toDateString() ? "today" : "";
  return `<span class="chip ${cls}">${d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span>`;
}
const PANELS = {
  async tasks() {
    const s = await api("/api/state");
    const open = s.tasks.filter((t) => !t.done).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    card("tasks", `Дела · ${open.length}`, open.slice(0, 8).map((t, i) => `<div class="li"><span>${i + 1}. ${esc(t.text)}</span>${dueChip(t.due)}</div>`).join("")
      || `<div class="muted">Открытых дел нет</div>`);
  },
  async notes() {
    const s = await api("/api/state");
    card("notes", `Память · ${s.notes.length}`, s.notes.slice(-6).reverse().map((n) => `<div class="li"><span>${esc(n.text)}</span></div>`).join("")
      || `<div class="muted">Пока ничего не запомнил. Скажите «запомни …»</div>`);
  },
  async reminders() {
    const s = await api("/api/state");
    card("reminders", "Напоминания", s.reminders.slice(0, 6).map((r) => `<div class="li"><span>${esc(r.text)}</span><span class="chip">${new Date(r.at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></div>`).join("")
      || `<div class="muted">Напоминаний нет</div>`);
  },
  history() { openDrawer("history"); },
  settings() { openDrawer("settings"); },
  telemetry() { $("#tele").classList.add("open"); pollTele(); },
  classic() { location.href = "/classic"; },
};
const SLASH = [
  ["дела", "Список дел", "tasks"], ["память", "Что я запомнил (заметки)", "notes"], ["напоминания", "Напоминания и таймеры", "reminders"],
  ["история", "История разговора", "history"], ["настройки", "Функции текущего режима", "settings"], ["система", "Видеопамять и модели", "telemetry"],
  ["всё", "Все разделы (классическое окно)", "classic"],
];

// ================= omnibar =================
let lastAct = 0, suggSel = 0;
const q = $("#q");
function suggestions() {
  const v = q.value.trim().toLowerCase();
  if (!v.startsWith("/")) return [];
  const w = v.slice(1);
  return SLASH.filter(([k, t]) => k.startsWith(w) || t.toLowerCase().split(/[\s(]+/).some((x) => x.startsWith(w)));
}
function renderSugg() {
  const list = suggestions(); suggSel = Math.min(suggSel, Math.max(0, list.length - 1));
  $("#sugg").innerHTML = list.map(([k, t, p], i) => `<div class="${i === suggSel ? "sel" : ""}" data-p="${p}"><span>${esc(t)}</span><kbd>/${k}</kbd></div>`).join("");
  $("#sugg").classList.toggle("show", list.length > 0);
  $("#sugg").querySelectorAll("div").forEach((d) => d.onclick = () => runPanel(d.dataset.p));
}
function runPanel(p) { q.value = ""; renderSugg(); PANELS[p](); }
q.addEventListener("input", () => { suggSel = 0; renderSugg(); });
q.addEventListener("keydown", async (e) => {
  const list = suggestions();
  if (list.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) { suggSel = (suggSel + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length; renderSugg(); e.preventDefault(); return; }
  if (e.key !== "Enter") return;
  if (list.length) return runPanel(list[suggSel][2]);
  const text = q.value.trim(); if (!text) return;
  q.value = ""; lastAct = Date.now();
  await api("/api/command", "POST", { text, speak: store.get("speak", false) });
});
$("#mic").onclick = () => { lastAct = Date.now(); api("/api/listen", "POST"); };
$("#hush").onclick = () => api("/api/stop", "POST");

// ================= modes =================
let prof = null, voiceEnrolled = false;
const READ_TEXT = "Привет, Джарвис. Сегодня я хочу спокойно закончить дела, а вечером немного поиграть. " +
  "Напомни мне купить хлеб и позвонить маме. Какая завтра погода? Открой, пожалуйста, телеграм и включи музыку. " +
  "(А теперь тише:) Джарвис, который час? Поставь таймер на пять минут.";
async function loadProfiles() { prof = await api("/api/profiles"); renderModes(); renderSettings(); }
async function pAct(action, body) { prof = await api(`/api/profiles/${action}`, "POST", body); renderModes(); renderSettings(); }
window.pAct = pAct;
function renderModes() {
  if (!prof) return;
  $("#modes").innerHTML = Object.entries(prof.profiles).map(([id, p]) =>
    `<button class="${id === prof.effective ? "on" : ""}" onclick="pAct('activate',{id:'${id}'})" title="Включить режим «${esc(p.title)}»">${p.icon || "⭐"} ${esc(p.title)}${id === prof.effective && id !== prof.active ? '<span class="auto">авто</span>' : ""}</button>`).join("");
}

// ================= drawers =================
function openDrawer(id) { closeAll(); $("#" + id).classList.add("open"); $("#scrim").classList.add("show"); if (id === "history") renderHistory(); }
function closeAll() { document.querySelectorAll(".drawer").forEach((d) => d.classList.remove("open")); $("#scrim").classList.remove("show"); $("#tele").classList.remove("open"); }
window.closeAll = closeAll;
$("#scrim").onclick = closeAll;
$("#histBtn").onclick = () => openDrawer("history");
$("#setBtn").onclick = () => openDrawer("settings");

let history = [];
function renderHistory() {
  $("#histList").innerHTML = history.slice().reverse().map((m) => `<div class="msg ${m.role === "user" ? "user" : ""}">${m.role === "user" ? "— " : ""}${esc(m.text)}
    <div class="meta">${esc(m.time || "")}${m.source ? " · " + esc(m.source) : ""}</div></div>`).join("") || `<div class="muted">Пока пусто</div>`;
}
const PERS = [["friend", "Друг — тепло, на «ты»"], ["work", "Деловой — кратко и по теме"], ["polite", "Вежливый — на «Вы»"]];
const sw = (checked, onchange, title, hint) => `<label class="sw"><input type="checkbox" ${checked ? "checked" : ""} onchange="${onchange}"><span class="t"></span>
  <span>${esc(title)}${hint ? `<small>${esc(hint)}</small>` : ""}</span></label>`;
function renderSettings() {
  if (!prof) return;
  const id = prof.effective, p = prof.profiles[id];
  $("#setTitle").textContent = `${p.icon || "⭐"} Режим «${p.title}»`;
  $("#setBody").innerHTML = `<div class="muted" style="font-size:13px">Настройки действуют, пока включён этот режим.</div>
    <h5>Характер</h5><select onchange="pAct('update',{id:'${id}',personality:this.value})">${PERS.map(([v, t]) => `<option value="${v}" ${p.personality === v ? "selected" : ""}>${t}</option>`).join("")}</select>
    <h5>Функции</h5>${Object.entries(prof.features).map(([k, f]) => sw(p.features[k], `pAct('update',{id:'${id}',feature:'${k}',value:this.checked})`, f.title, f.hint)).join("")}
    <h5>Мой голос</h5>
    <div style="font-size:14px">${voiceEnrolled ? "✅ Джарвис знает ваш голос и не реагирует на чужие голоса (в играх строже)." : "Джарвис пока отвечает любому голосу. Запомните свой — тогда друзья в войс-чате и звук из колонок его не разбудят."}</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="link" style="margin:0;flex:1" onclick="api('/api/voice/enroll','POST');closeAll()">${voiceEnrolled ? "Запомнить заново" : "🎙 Запомнить мой голос"}</button>
      ${voiceEnrolled ? `<button class="link" style="margin:0" onclick="if(confirm('Забыть ваш голос?'))api('/api/voice/forget','POST')">Забыть</button>` : ""}
    </div>
    <h5>Это окно</h5>
    ${sw(store.get("speak", false), "store.set('speak',this.checked)", "Отвечать голосом на набранный текст", "")}
    ${sw(store.get("cards", true), "store.set('cards',this.checked)", "Показывать карточки", "Дела, память, напоминания появляются сами после команды и исчезают")}
    ${sw(prof.auto_game, "pAct('auto_game',{value:this.checked})", "Игровой режим сам при запуске игры", "")}
    <a class="link" href="/classic">Все разделы и настройки →</a>`;
}
window.store = store;

// ================= telemetry =================
async function pollTele() {
  if (document.hidden) return;
  try {
    const t = await api("/api/telemetry");
    if (t.gpu) {
      $("#tVram").textContent = `${(t.gpu.vram_used / 1024).toFixed(1)} / ${(t.gpu.vram_total / 1024).toFixed(1)} ГБ`;
      $("#bVram").style.width = (100 * t.gpu.vram_used / t.gpu.vram_total) + "%";
    }
    $("#tCpu").textContent = t.cpu + "%"; $("#bCpu").style.width = t.cpu + "%";
    const llm = t.llm == null ? "Ollama не запущена" : t.llm.length ? t.llm.map((m) => `${m.name} · ${m.vram_mb} МБ`).join("<br>") : "выгружена (освобождает видеокарту)";
    $("#tMore").innerHTML = `${t.gpu ? `${esc(t.gpu.name)} · ${t.gpu.util}% · ${t.gpu.temp}°C<br>` : ""}
      ИИ: ${llm}<br>Слух: ${Object.entries(t.whisper).map(([k, d]) => `${k} на ${d === "cuda" ? "GPU" : "CPU"}`).join(", ") || "—"}<br>
      Память: ${t.memory_model ? "модель смыслов на CPU" : "не загружена"}<br>
      ОЗУ: ${t.ram ? `${t.ram.used_gb} / ${t.ram.total_gb} ГБ` : "—"}${t.game ? "<br>🎮 игровой режим" : ""}`;
  } catch {}
}
$("#tele").onclick = (e) => { e.stopPropagation(); $("#tele").classList.toggle("open"); };
setInterval(pollTele, 3000); pollTele();
document.addEventListener("visibilitychange", pollTele);

// ================= keyboard =================
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeAll(); q.blur(); q.value = ""; renderSugg(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "k") { e.preventDefault(); q.focus(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "h") { e.preventDefault(); openDrawer("history"); return; }
  if (e.ctrlKey && e.key === ",") { e.preventDefault(); openDrawer("settings"); return; }
  const typing = document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (!typing && !e.ctrlKey && !e.altKey && e.key.length === 1) q.focus();   // just start typing
});

// ================= live events =================
const AUTO_CARD = { "tasks.json": "tasks", "notes.md": "notes", "reminders.json": "reminders" };
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "level") { lvTarget = Math.min(1, ev.v / 1400); if (ev.s !== status) setStatus(ev.s); }
    else if (ev.type === "status") setStatus(ev.state);
    else if (ev.type === "message") {
      history.push(ev); if (history.length > 200) history.shift();
      sub(ev.role, ev.text);
      if (ev.role === "user") lastAct = Date.now();
      if ($("#history").classList.contains("open")) renderHistory();
    }
    else if (ev.type === "heard" && !ev.ok) { $("#you").textContent = "не разобрал: " + ev.text; $("#you").classList.remove("fade"); }
    else if (ev.type === "data" && AUTO_CARD[ev.file] && store.get("cards", true) && Date.now() - lastAct < 15000) PANELS[AUTO_CARD[ev.file]]();
    else if (ev.type === "profiles") loadProfiles();
    else if (ev.type === "vision") card("vision", "Смотрю на экран", `<img src="data:image/png;base64,${ev.thumb}" alt=""
        style="width:100%;border-radius:8px;border:1px solid var(--line);display:block"><div class="chip" style="margin-top:6px">${esc(ev.title)}</div>`, 20000);
    else if (ev.type === "settings") api("/api/state").then((s) => { voiceEnrolled = !!s.voice_enrolled; renderSettings(); });
    else if (ev.type === "enroll") {
      if (ev.state === "on") {
        const pct = Math.min(100, Math.round(100 * ev.seconds / ev.need));
        card("enroll", "Запоминаю ваш голос", `<div style="font-size:14px;margin-bottom:8px">Прочитайте вслух:</div>
          <div style="font-size:15px;line-height:1.5">${esc(READ_TEXT)}</div>
          <div class="bar" style="margin-top:10px;height:5px"><i style="width:${pct}%"></i></div>
          <div class="chip" style="margin-top:4px">${ev.seconds} из ${ev.need} с речи</div>`, 0);
      } else card("enroll", ev.ok ? "Голос запомнен" : "Не получилось", ev.ok
          ? `<div>Теперь Джарвис слушается только вас.</div>` : `<div>Мало речи. Попробуйте ещё раз и говорите подольше.</div>`, 9000);
    }
    else if (ev.type === "game") { game = ev.on; setStatus(); toast(ev.on ? "🎮 Игровой режим: " + ev.name : "Игровой режим выключен"); }
    else if (ev.type === "record") {
      if (ev.state === "on") card("rec", "● Запись", `<div>Идёт запись${ev.seconds ? " · " + ev.seconds + " с" : ""}. Скажите «стоп».</div>`, 0);
      else { card("rec", "Запись сохранена", `<div class="muted">${esc(ev.name || "")}</div>`, 8000); }
    }
  };
  ws.onclose = () => { setStatus("starting"); setTimeout(() => { connect(); load(); }, 2000); };
}
async function load() {
  const s = await api("/api/state");
  history = s.history || []; game = !!s.game?.on; setStatus(s.status);
  voiceEnrolled = !!s.voice_enrolled; renderSettings();
  const last = history.filter((m) => m.role !== "user").slice(-1)[0];
  if (last && Date.now() - lastAct > 1000) { $("#him").textContent = last.text; $("#him").classList.add("fade"); }
}
load().then(connect);
loadProfiles();
</script>
</body>
</html>
