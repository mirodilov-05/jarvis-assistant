<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Джарвис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=5">
<link rel="stylesheet" href="/static/skins.css?v=9">
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Разделы">
    <div class="brand"><span class="brand-orb" aria-hidden="true"></span>Джарвис</div>
    <nav class="nav" id="nav" aria-label="Основное">
      <a href="#/" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</a>
      <a href="#/tasks" data-page="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Дела</a>
      <a href="#/goals" data-page="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>Цели</a>
      <a href="#/commands" data-page="commands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l9-11h-6z"/></svg>Команды</a>
      <a href="#/memory" data-page="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V4z"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1V4z"/></svg>Память</a>
      <a href="#/show" data-page="show"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>Презентация</a>
      <div class="group">Настройка</div>
      <a href="#/settings" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Настройки</a>
      <a href="#/appearance" data-page="appearance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-1-1-1.5-2-1.5h-2a2 2 0 0 1-2-2 2 2 0 0 0-2-2c-1 0-1-1-1-2a2 2 0 0 0 0-1.5z"/></svg>Внешний вид</a>
      <a href="#/help" data-page="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>Инструкции</a>
    </nav>
    <div class="rail-foot">
      <div class="status-pill" id="pillCloud"><i></i><span>—</span></div>
      <div class="status-pill" id="pillLink"><i></i><span>Связь</span></div>
      <button class="btn ghost" id="btnPalette" type="button" aria-label="Открыть поиск команд (Ctrl+K)">Поиск <span class="kbd">Ctrl K</span></button>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <header class="topbar">
      <div class="titles"><h1 id="pgTitle">Главная</h1><p id="pgSub"></p></div>
      <div class="actions" id="pgActions"></div>
    </header>
    <section class="view" id="view" aria-live="polite"></section>
  </main>
</div>

<dialog class="dlg" id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<div class="cmdk" id="cmdk" hidden role="dialog" aria-label="Поиск команд">
  <input id="cmdkIn" type="search" placeholder="Что сделать? Например: «включи телевизор» или «сделай страницу настроек»" autocomplete="off">
  <div class="hits" id="cmdkHits"></div>
</div>

<div class="stage" id="stage" hidden role="dialog" aria-label="Презентация на весь экран"></div>

<script src="/static/land.js?v=1"></script>
<script src="/static/core.js?v=6"></script>
<script src="/static/robot.js?v=1"></script>
<script src="/static/app.js?v=12"></script>
<script src="/static/pages.js?v=9"></script>
<script src="/static/help.js?v=7"></script>
</body>
</html>
