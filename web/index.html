<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Джарвис</title>
<style>
:root {
  --accent: 79, 209, 255;          /* chosen neon (rgb) — set by JS from ⚙ Внешний вид */
  --c: var(--accent);              /* current state colour */
  --glass: .72;                    /* panel opacity */
  --bg: #03060b; --text: #d6ecff; --muted: #7b93a8; --line: rgba(140, 200, 255, .14);
  --amber: #ffb547; --red: #ff5468; --green: #3ee6a1;
  --mono: "Cascadia Mono", Consolas, monospace; --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: rgba(18, 30, 44, .9); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(var(--accent), .6); }
:focus-visible { outline: 2px solid rgba(var(--accent), .7); outline-offset: 2px; }
.muted { color: var(--muted); }
.panel { background: rgba(10, 18, 28, var(--glass)); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(14px); }

/* ---- background layer ---- */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 38%, rgba(var(--c), .12), transparent 58%),
              radial-gradient(ellipse at 15% 90%, rgba(var(--accent), .06), transparent 50%), linear-gradient(160deg, #060b12, #020407 70%); }
#bg video, #bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#bg .dim { position: absolute; inset: 0; background: #000; opacity: .55; }
#bg::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); }

/* ---- header ---- */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 6; display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.brand { font: 600 12px var(--mono); letter-spacing: .32em; color: rgb(var(--accent)); text-shadow: 0 0 12px rgba(var(--accent), .6); white-space: nowrap; }
.pill { font: 600 11px var(--mono); letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--green); border-color: rgba(62, 230, 161, .35); }
.pill.warn { color: var(--amber); border-color: rgba(255, 181, 71, .35); }
.pill.bad { color: var(--red); border-color: rgba(255, 84, 104, .35); }
#personas { display: flex; gap: 4px; padding: 3px; border-radius: 999px; }
#personas button { padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
#personas button.on { background: rgb(var(--accent)); color: #021018; box-shadow: 0 0 16px rgba(var(--accent), .45); }
#personas button:not(.on):hover { color: var(--text); }
.spacer { flex: 1; }
#tele { font: 11px var(--mono); color: var(--muted); white-space: nowrap; cursor: pointer; }
#tele b { color: var(--text); font-weight: 600; }
.tools { display: flex; gap: 2px; }
.tools button { height: 34px; padding: 0 10px; border-radius: 10px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.tools button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }

/* ---- tasks widget ---- */
#tasks { position: fixed; left: 16px; top: 74px; width: 290px; z-index: 3; padding: 12px 14px; }
.wtitle { font: 600 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: rgb(var(--accent)); display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.wtitle button { color: var(--muted); font-size: 16px; line-height: 1; }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.04); font-size: 14px; }
.task:first-of-type { border-top: 0; }
.task input { width: 16px; height: 16px; margin-top: 2px; accent-color: rgb(var(--accent)); flex-shrink: 0; }
.task > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.task > div > span { overflow-wrap: anywhere; }
.chip { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.chip.over { color: var(--red); } .chip.today { color: var(--amber); }
#taskAdd { display: none; margin-top: 8px; }
#focusBar { display: none; margin-top: 10px; font: 12px var(--mono); color: var(--amber); }

/* ---- stage ---- */
#stage { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 130px; pointer-events: none; }
#reactor { width: min(44vh, 62vw); height: min(44vh, 62vw); cursor: pointer; pointer-events: auto; }
#state { margin-top: 4px; font: 12px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: rgb(var(--c)); }
#subs { min-height: 92px; width: min(760px, 90vw); margin-top: 16px; text-align: center; }
#you { color: var(--muted); font-size: 14px; transition: opacity .8s; }
#him { font-size: 19px; margin-top: 6px; transition: opacity .8s; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
.fade { opacity: 0; }

/* ---- omnibar ---- */
#omni { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(720px, 92vw); z-index: 6; }
#omni .box { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 16px; border-radius: 16px; }
#omni .box:focus-within { border-color: rgba(var(--accent), .55); box-shadow: 0 0 24px rgba(var(--accent), .15); }
#q { flex: 1; min-width: 0; background: none; border: 0; padding: 9px 0; font-size: 16px; }
#q::placeholder { color: #50677a; }
#omni .box > button { height: 38px; min-width: 38px; padding: 0 9px; border-radius: 11px; font-size: 15px; color: var(--muted); white-space: nowrap; }
#omni .box > button:hover { background: rgba(255,255,255,.07); color: var(--text); }
#mic.on { color: #021018 !important; background: rgb(var(--accent)) !important; }
#sugg { margin-bottom: 8px; overflow: hidden; display: none; }
#sugg.show { display: block; }
#sugg div { padding: 9px 16px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
#sugg div.sel, #sugg div:hover { background: rgba(var(--accent), .12); }
#sugg kbd { font: 12px var(--mono); color: var(--muted); }
.hint { text-align: center; font: 11px var(--mono); color: #4a6072; margin-top: 7px; }

/* ---- cards ---- */
#cards { position: fixed; right: 16px; top: 74px; bottom: 110px; width: 320px; display: flex; flex-direction: column; gap: 10px; z-index: 3; overflow: hidden; }
.card { padding: 12px 14px; animation: in .35s ease; transition: opacity .5s, transform .5s; flex-shrink: 0; border-left: 2px solid rgb(var(--accent)); }
.card.out { opacity: 0; transform: translateX(30px); }
.card h4 { margin: 0 0 8px; font: 600 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: rgb(var(--accent)); display: flex; justify-content: space-between; }
.card h4 button { color: var(--muted); }
.li { display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.04); font-size: 14px; }
.li:first-of-type { border-top: 0; }
.li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.pre { white-space: pre-wrap; font-size: 14px; max-height: 50vh; overflow-y: auto; }
@keyframes in { from { opacity: 0; transform: translateX(30px); } }

/* ---- drawers ---- */
.drawer { position: fixed; top: 0; bottom: 0; width: min(440px, 94vw); z-index: 10; padding: 18px 20px 40px; overflow-y: auto;
  background: rgba(7, 12, 19, .97); border: 0 solid var(--line); transition: transform .28s ease; }
.drawer.right { right: 0; border-left-width: 1px; transform: translateX(105%); }
.drawer.left { left: 0; border-right-width: 1px; transform: translateX(-105%); }
.drawer.open { transform: none; }
.drawer h3 { margin: 0 0 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
.drawer h3 button { color: var(--muted); font-size: 16px; }
details { border-top: 1px solid var(--line); padding: 4px 0; }
summary { cursor: pointer; padding: 12px 0; font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "+"; } details[open] summary::after { content: "–"; }
details[open] summary { color: rgb(var(--accent)); }
.sec { display: flex; flex-direction: column; gap: 10px; padding-bottom: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > input, .row > select { flex: 1; min-width: 0; }
.btn { padding: 8px 14px; border-radius: 10px; background: rgb(var(--accent)); color: #021018; font-weight: 600; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 400; }
.btn.danger { background: transparent; color: var(--red); border: 1px solid rgba(255, 84, 104, .35); font-weight: 400; }
.note { font-size: 12.5px; color: var(--muted); }
.note a { color: rgb(var(--accent)); }
label.lbl { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }
label.lbl a { color: rgb(var(--accent)); }
.sw { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0; cursor: pointer; }
.sw input { display: none; }
.sw .t { width: 34px; height: 20px; border-radius: 10px; background: #233140; position: relative; flex-shrink: 0; margin-top: 2px; transition: .2s; }
.sw .t::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #8aa0b4; transition: .2s; }
.sw input:checked + .t { background: rgb(var(--accent)); }
.sw input:checked + .t::after { left: 17px; background: #021018; }
.sw small { display: block; color: var(--muted); font-size: 12px; }
.swatches { display: flex; gap: 10px; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; }
.swatches button.on { border-color: #fff; box-shadow: 0 0 14px currentColor; }
.keyrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.macro { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.macro .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.act { display: grid; grid-template-columns: 150px 1fr auto; gap: 6px; margin-top: 6px; }
.msg { padding: 8px 0; border-top: 1px solid rgba(255,255,255,.05); font-size: 14px; }
.msg.user { color: var(--muted); }
.msg .meta { font: 11px var(--mono); color: #4a6072; }
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; display: none; }
#scrim.show { display: block; }
#toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 13px; opacity: 0; transition: .3s; z-index: 20; pointer-events: none; }
#toast.show { opacity: 1; }
#onb { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.onb { width: min(560px, 100%); padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow-y: auto; }
.onb h2 { margin: 0; font: 600 22px "Segoe UI", sans-serif; }
.onb .steps { display: flex; gap: 6px; } .onb .steps i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); }
.onb .steps i.on { background: rgb(var(--accent)); }
.onb .nav { display: flex; justify-content: space-between; margin-top: 6px; }
@media (max-width: 1250px) { .lbl2 { display: none; } }
@media (max-width: 1100px) { #cards { width: 270px; } #tasks { width: 250px; } #tele { font-size: 10px; } }
@media (max-width: 900px) { #cards, #tasks, #tele { display: none; } #personas button { padding: 5px 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="bg"><div class="dim" id="dim"></div></div>

<header>
  <div class="brand">J.A.R.V.I.S</div>
  <span class="pill" id="link">…</span>
  <div id="personas" class="panel"></div>
  <span class="pill warn" id="focusPill" hidden>ФОКУС</span>
  <div class="spacer"></div>
  <div id="tele" title="Нажмите — подробности">—</div>
  <div class="tools">
    <button id="macBtn" title="Макросы">⚡<span class="lbl2"> Макросы</span></button>
    <button id="histBtn" title="История (Ctrl+H)">🕘</button>
    <button id="setBtn" title="Настройки (Ctrl+,)">⚙<span class="lbl2"> Настройки</span></button>
    <button id="trayBtn" title="Свернуть в трей — Джарвис продолжит слушать">⤓<span class="lbl2"> Трей</span></button>
  </div>
</header>

<section id="tasks" class="panel" aria-label="Оперативные задачи">
  <div class="wtitle"><span>Задачи</span><button id="taskPlus" title="Добавить дело">+</button></div>
  <div id="taskList"></div>
  <div id="taskAdd"><input id="taskInput" placeholder="Что сделать? Enter — добавить" autocomplete="off"></div>
  <div id="focusBar"></div>
</section>

<div id="stage">
  <canvas id="reactor" title="Нажмите, чтобы сказать команду"></canvas>
  <div id="state">запуск</div>
  <div id="subs"><div id="you"></div><div id="him"></div></div>
</div>

<div id="cards"></div>

<div id="omni">
  <div id="sugg" class="panel"></div>
  <div class="box panel">
    <input id="q" autocomplete="off" placeholder="Скажите «Эй, Джарвис» или напишите…   / — разделы">
    <button id="eyeBtn" title="Что на экране">👁 Экран</button>
    <button id="mic" title="Говорить">🎙</button>
    <button id="quickMac" title="Запустить макрос">⚡</button>
    <button id="hush" title="Замолчать">⏹</button>
  </div>
  <div class="hint">Enter — выполнить · / — разделы · Ctrl+K — сюда · Ctrl+Alt+Space — капсула поверх игр</div>
</div>

<div id="scrim"></div>

<aside class="drawer left" id="history"><h3>История <button onclick="closeAll()" aria-label="Закрыть">✕</button></h3><div id="histList"></div></aside>

<aside class="drawer right" id="macros">
  <h3>⚡ Макросы <button onclick="closeAll()" aria-label="Закрыть">✕</button></h3>
  <p class="note">Своя фраза → цепочка действий. Скажите фразу (или «Джарвис, …фраза») — Джарвис выполнит всё по порядку.</p>
  <div id="macList" style="display:flex;flex-direction:column;gap:10px"></div>
  <button class="btn" style="margin-top:12px" onclick="newMacro()">+ Новый макрос</button>
</aside>

<aside class="drawer right" id="settings">
  <h3>⚙ Настройки <button onclick="closeAll()" aria-label="Закрыть">✕</button></h3>
  <div id="setBody"></div>
</aside>
<div id="toast" class="panel"></div>
<div id="onb" hidden><div class="onb panel" role="dialog" aria-modal="true" aria-labelledby="onbTitle"><div id="onbBody"></div></div></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }
const store = { get(k, d) { try { const v = localStorage.getItem("j3." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("j3." + k, JSON.stringify(v)); } catch {} } };
window.store = store;

let V = null, state = null, prof = null, conn = null, macros = null, history = [], status = "starting", game = false, lastAct = 0;

// ================= accent & look =================
const ACCENTS = { cyan: "79,209,255", emerald: "62,230,161", amber: "255,181,71", red: "255,84,104", violet: "176,132,255" };
const ACCENT_NAMES = { cyan: "Циан", emerald: "Изумруд", amber: "Янтарь", red: "Красный", violet: "Фиолетовый" };
function applyLook() {
  const ui = V?.ui || {}, root = document.documentElement.style;
  root.setProperty("--accent", ACCENTS[ui.accent] || ACCENTS.cyan);
  root.setProperty("--glass", ui.glass ?? .72);
  const bg = $("#bg"), cur = bg.querySelector("video,img");
  const want = ui.bg?.url || "";
  if ((cur?.dataset.src || "") !== want) {
    cur?.remove();
    if (ui.bg) {
      const el = document.createElement(ui.bg.kind === "video" ? "video" : "img");
      el.dataset.src = want; el.src = want;
      if (ui.bg.kind === "video") { el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; }
      bg.prepend(el);
    }
  }
  $("#dim").style.opacity = ui.bg ? (ui.dim ?? .55) : 0;
}

// ================= state colours =================
const LOOK = { starting: ["120,140,160", "запуск"], listening: [null, "жду «Джарвис»"], recording: [null, "слушаю вас"],
  thinking: ["255,181,71", "думаю"], speaking: ["120,170,255", "говорю"], taping: ["255,84,104", "● идёт запись"], game: ["62,230,161", "игровой режим"] };
function setStatus(s) {
  status = s || status;
  const [c, t] = game && status === "listening" ? LOOK.game : (LOOK[status] || LOOK.listening);
  document.documentElement.style.setProperty("--c", c || "var(--accent)");
  $("#state").textContent = t;
  $("#mic").classList.toggle("on", status === "recording");
}

// ================= reactor =================
const cv = $("#reactor"), g = cv.getContext("2d");
let lvTarget = 0, lv = 0, lastFrame = 0;
function fit() { const d = devicePixelRatio || 1, r = cv.getBoundingClientRect(); cv.width = r.width * d; cv.height = r.height * d; }
addEventListener("resize", fit); fit();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function rgbOf() { const v = getComputedStyle(document.documentElement).getPropertyValue("--c").trim(); return v.startsWith("var") ? getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() : v; }
function draw(t) {
  requestAnimationFrame(draw);
  const busy = status !== "listening" || lv > .03;
  if ((!busy || reduce) && t - lastFrame < (reduce ? 200 : 50)) return;
  lastFrame = t;
  const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * .46, s = reduce ? 0 : t / 1000, dpr = devicePixelRatio || 1;
  const C = rgbOf(), col = (a) => `rgba(${C},${a})`;
  let target = lvTarget;
  if (status === "speaking") target = .35 + .25 * Math.sin(s * 9) * Math.sin(s * 3.3);
  if (status === "thinking") target = .12;
  lv += (target - lv) * .25;
  g.clearRect(0, 0, W, H); g.lineCap = "round";
  const spin = status === "thinking" ? s * .9 : s * .08;
  for (let i = 0; i < 72; i++) {
    const a = i / 72 * Math.PI * 2 + spin, long = i % 6 === 0;
    g.strokeStyle = col(long ? .55 : .18); g.lineWidth = (long ? 2.2 : 1.2) * dpr / 1.5;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * R * (long ? .9 : .93), cy + Math.sin(a) * R * (long ? .9 : .93));
    g.lineTo(cx + Math.cos(a) * R * .97, cy + Math.sin(a) * R * .97); g.stroke();
  }
  [[.82, .7, 1.1, 3], [.74, -1.2, .7, 2], [.66, 2.1, 1.6, 1.5]].forEach(([rr, sp, len, w], i) => {
    const k = status === "thinking" ? 3 : 1, a0 = s * sp * k * .6 + i;
    g.strokeStyle = col(.5 - i * .1); g.lineWidth = w * dpr;
    g.beginPath(); g.arc(cx, cy, R * rr, a0, a0 + len); g.stroke();
    g.beginPath(); g.arc(cx, cy, R * rr, a0 + Math.PI, a0 + Math.PI + len * .5); g.stroke();
  });
  g.strokeStyle = col(.85); g.lineWidth = 2 * dpr; g.shadowColor = col(.9); g.shadowBlur = 18;
  g.beginPath();
  for (let i = 0; i <= 160; i++) {
    const a = i / 160 * Math.PI * 2;
    const n = Math.sin(a * 6 + s * 4) * .5 + Math.sin(a * 11 - s * 6.3) * .3 + Math.sin(a * 3 + s * 2.1) * .2;
    const r = R * (.504 + lv * .16 * n + .006 * Math.sin(a * 4 + s));
    i ? g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  g.closePath(); g.stroke(); g.shadowBlur = 0;
  const cr = R * (.3 + lv * .07), grd = g.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.6);
  grd.addColorStop(0, "rgba(255,255,255,.95)"); grd.addColorStop(.18, col(.95)); grd.addColorStop(.55, col(.25)); grd.addColorStop(1, col(0));
  g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, cr * 1.6, 0, Math.PI * 2); g.fill();
  g.strokeStyle = col(.7); g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, cr * .62, 0, Math.PI * 2); g.stroke();
}
requestAnimationFrame(draw);
cv.onclick = () => { lastAct = Date.now(); api("/api/listen", "POST"); };

// ================= subtitles =================
let subTimer;
function sub(role, text) {
  const el = role === "user" ? $("#you") : $("#him");

// ================= interface sounds =================
let AC = null;
function blip(f1, f2, d = 0.07, vol = 0.035) {
  if (!V?.voice?.ui_sounds) return;
  try {
    AC = AC || new AudioContext();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime;
    o.type = "sine"; o.frequency.setValueAtTime(f1, t0); o.frequency.linearRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch {}
}
addEventListener("pointerdown", () => { try { AC = AC || new AudioContext(); AC.resume(); } catch {} }, { once: true });

// ================= cards =================
const cards = new Map();
function card(id, title, html, ttl = 16000) {
  let el = cards.get(id);
  if (!el) {
    el = document.createElement("div"); el.className = "card panel";
    el.onmouseenter = () => clearTimeout(el._t); el.onmouseleave = () => arm(el, id, 6000);
    $("#cards").prepend(el); cards.set(id, el); blip(1250, 1560, 0.05);
    while (cards.size > 4) { const [k] = cards.keys(); drop(k); }
  }
  el.innerHTML = `<h4>${esc(title)}<button aria-label="Закрыть" onclick="drop('${id}')">✕</button></h4>${html}`;
  el.classList.remove("out"); arm(el, id, ttl);
}
function arm(el, id, ttl) { clearTimeout(el._t); if (ttl) el._t = setTimeout(() => drop(id), ttl); }
function drop(id) { const el = cards.get(id); if (!el) return; cards.delete(id); el.classList.add("out"); setTimeout(() => el.remove(), 500); }
window.drop = drop;
const fmtD = (d) => new Date(d).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function dueChip(due) {
  if (!due) return "";
  const d = new Date(due), now = new Date();
  const cls = d < now ? "over" : d.toDateString() === now.toDateString() ? "today" : "";
  return `<span class="chip ${cls}">${fmtD(due)}</span>`;
}

const q = $("#q"); let suggSel = 0;
function suggestions() {
  const v = q.value.trim().toLowerCase();
  if (!v.startsWith("/")) return [];
  const w = v.slice(1);
  return SLASH.filter(([k, t]) => k.startsWith(w) || t.toLowerCase().split(/[\s()]+/).some((x) => x.startsWith(w)));
}
function renderSugg() {
  const list = suggestions(); suggSel = Math.min(suggSel, Math.max(0, list.length - 1));
  $("#sugg").innerHTML = list.map(([k, t, p], i) => `<div class="${i === suggSel ? "sel" : ""}" data-p="${p}"><span>${esc(t)}</span><kbd>/${k}</kbd></div>`).join("");
  $("#sugg").classList.toggle("show", list.length > 0);
  $("#sugg").querySelectorAll("div").forEach((d) => d.onclick = () => runPanel(d.dataset.p));
}
function runPanel(p) { q.value = ""; renderSugg(); PANELS[p](); }
async function send(text) { lastAct = Date.now(); await api("/api/command", "POST", { text, speak: store.get("speak", false) }); }
q.addEventListener("input", () => { suggSel = 0; renderSugg(); });
q.addEventListener("keydown", (e) => {
  const list = suggestions();
  if (list.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) { suggSel = (suggSel + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length; renderSugg(); e.preventDefault(); return; }
  if (e.key !== "Enter") return;
  if (list.length) return runPanel(list[suggSel][2]);
  const text = q.value.trim(); if (!text) return;
  q.value = ""; send(text);
});

      <input type="file" accept="video/mp4,video/webm,image/*" onchange="uploadBg(this)" style="padding:6px"></div>
    ${ui.bg ? `<div><label class="lbl">Затемнение фона</label><input type="range" min="0" max="0.9" step="0.05" value="${ui.dim}" onchange="setVal('ui','dim',+this.value)" style="padding:0"></div>
      <button class="btn danger" onclick="api('/api/bg','DELETE')">Убрать фон</button>` : ""}`;
  const vo = V.voice || {};
  const EDGE = [["ru-RU-DmitryNeural", "Дмитрий — мужской"], ["ru-RU-SvetlanaNeural", "Светлана — женский"], ["ru-RU-DariyaNeural", "Дария — женский"]];
  const voice = `<div><label class="lbl">Синтезатор</label><select onchange="setVal('voice','tts_engine_ru',this.value)">
        <option value="piper" ${vo.engine === "piper" ? "selected" : ""}>Piper — офлайн, мгновенно</option>
        <option value="edge" ${vo.engine === "edge" ? "selected" : ""}>Microsoft Neural — живее, нужен интернет</option></select></div>
    ${vo.engine === "edge" ? `<div><label class="lbl">Голос Microsoft</label><select onchange="setVal('voice','edge_voice_ru',this.value)">${EDGE.map(([id, t]) => `<option value="${id}" ${vo.edge === id ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <div class="row"><div style="flex:1"><label class="lbl">Скорость: ${esc(vo.edge_rate)}</label><input type="range" min="-30" max="40" step="5" value="${parseInt(vo.edge_rate) || 0}" style="padding:0" onchange="setVal('voice','edge_rate',(this.value>=0?'+':'')+this.value+'%')"></div>
        <div style="flex:1"><label class="lbl">Тембр: ${esc(vo.edge_pitch)}</label><input type="range" min="-20" max="20" step="2" value="${parseInt(vo.edge_pitch) || 0}" style="padding:0" onchange="setVal('voice','edge_pitch',(this.value>=0?'+':'')+this.value+'Hz')"></div></div>`
    : `<div><label class="lbl">Голос Piper</label><select onchange="setVal('voice','piper_voice_ru',this.value)">${(vo.piper_voices || []).map((n) => `<option ${vo.piper === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>`}
    <button class="btn ghost" onclick="api('/api/say','POST',{text:'Привет, сэр. Так звучит мой голос.'})">▶ Послушать</button>
    ${sw(vo.ui_sounds, "setVal('voice','ui_sounds',this.checked)", "Звуки интерфейса", "Короткие тактические сигналы при пробуждении, ответе и в окне")}
    <div><label class="lbl">Музыка во время разговора: ${Math.round((vo.duck_level ?? .15) * 100)}%</label><input type="range" min="0" max="0.6" step="0.05" value="${vo.duck_level ?? .15}" style="padding:0" onchange="setVal('voice','duck_level',+this.value)"></div>
    <div><label class="lbl">Голосовой пак (короткие фразы персонажа при выполнении команд)</label>
      <select onchange="api('/api/pack','POST',{name:this.value})"><option value="">Без пака — голос Piper</option>${V.packs.map((p) => `<option ${V.pack === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
      <div class="note">Свои паки: папка voices\\packs\\&lt;имя&gt;\\ok, start, error с файлами .wav.</div></div>
    <div style="font-size:14px">${V.voice_enrolled ? "✅ Джарвис знает ваш голос." : "Джарвис отвечает любому голосу."}</div>
    <div class="row"><button class="btn ghost" onclick="api('/api/voice/enroll','POST');closeAll()">${V.voice_enrolled ? "Запомнить заново" : "🎙 Запомнить мой голос"}</button>
      ${V.voice_enrolled ? `<button class="btn danger" onclick="if(confirm('Забыть ваш голос?'))api('/api/voice/forget','POST')">Забыть</button>` : ""}</div>
    ${sw(store.get("speak", false), "store.set('speak',this.checked)", "Отвечать голосом на набранный текст", "")}`;
  const bot = `<div class="note">Управление ноутбуком с телефона. 1) Telegram → <b>@BotFather</b> → /newbot → скопируйте токен. 2) Вставьте сюда. 3) Напишите своему боту любое сообщение и нажмите «Это я». Бот слушается только вас.</div>
    <div><label class="lbl">Токен бота ${keyState(k.telegram_bot)} ${rb.running ? `<span class="pill ok">@${esc(rb.username)} работает</span>` : rb.error ? `<span class="pill bad">${esc(rb.error)}</span>` : ""}</label>
      <div class="keyrow"><input id="kBot" type="password" placeholder="123456:ABC…" autocomplete="off"><button class="btn" onclick="saveKey('telegram_bot','kBot')">Сохранить</button></div></div>
    ${rb.owner_id ? `<div style="font-size:14px">Хозяин: ID ${rb.owner_id} <button class="btn ghost" onclick="api('/api/remote','POST',{owner_id:0})">Отвязать</button></div>`
      : rb.pending ? `<div class="row"><span style="font-size:14px">Написал: ${esc(rb.pending.name)} ${rb.pending.username ? "@" + esc(rb.pending.username) : ""} (ID ${rb.pending.id})</span><button class="btn" onclick="api('/api/remote','POST',{owner_id:${rb.pending.id}})">Это я</button></div>`
      : k.telegram_bot ? `<div class="note">Напишите своему боту в Telegram — здесь появится кнопка «Это я».</div>` : ""}
    ${sw(rb.enabled, "api('/api/remote','POST',{enabled:this.checked})", "Бот включён", "/screen, /status, /run, /close_game, /shutdown или любая команда текстом")}`;
  let modes = `<div class="muted">Загрузка…</div>`;
  if (prof) {
    const id = prof.effective, p = prof.profiles[id];
    modes = `<div class="row"><select onchange="pAct('activate',{id:this.value})">${Object.entries(prof.profiles).map(([pid, pp]) => `<option value="${pid}" ${pid === id ? "selected" : ""}>${pp.icon || ""} ${esc(pp.title)}</option>`).join("")}</select></div>
      <div class="note">Функции режима «${esc(p.title)}»:</div>
      ${Object.entries(prof.features).map(([fk, f]) => sw(p.features[fk], `pAct('update',{id:'${id}',feature:'${fk}',value:this.checked})`, f.title, f.hint)).join("")}
      ${sw(prof.auto_game, "pAct('auto_game',{value:this.checked})", "Игровой режим сам при запуске игры", "")}`;
  }
  let conns = `<div class="muted">Загрузка…</div>`;
  if (conn) {
    const c = conn, tg = c.telegram, wa = c.whatsapp;
    const tgBody = tg.connected ? `<div class="row"><span class="pill ok">подключён</span><button class="btn ghost" onclick="cAct('telegram_logout')">Выйти</button></div>`
      : !tg.has_hash ? `<div class="note">Чтение ваших чатов: my.telegram.org → API development tools → api_id и api_hash.</div><div class="row"><input id="tgId" placeholder="api_id" style="max-width:110px"><input id="tgHash" placeholder="api_hash"><button class="btn" onclick="cAct('telegram_creds',{api_id:v('tgId'),api_hash:v('tgHash')})">OK</button></div>`
      : tgStep === "code" ? `<div class="row"><input id="tgCode" placeholder="Код из Telegram"><button class="btn" onclick="cAct('telegram_signin',{code:v('tgCode')})">Войти</button></div>`
      : tgStep === "password" ? `<div class="row"><input id="tgPwd" type="password" placeholder="Облачный пароль"><button class="btn" onclick="cAct('telegram_signin',{password:v('tgPwd')})">Войти</button></div>`
      : `<div class="row"><input id="tgPhone" placeholder="+998 90 123 45 67"><button class="btn" onclick="cAct('telegram_code',{phone:v('tgPhone')})">Код</button></div>`;
    const waBody = !wa.enabled ? `<button class="btn ghost" onclick="cAct('whatsapp',{enabled:true})">Включить</button>`
      : wa.state === "connected" ? `<div class="row"><span class="pill ok">подключён</span><button class="btn ghost" onclick="cAct('whatsapp_logout')">Выйти</button><button class="btn ghost" onclick="cAct('whatsapp',{enabled:false})">Выключить</button></div>`
      : wa.state === "qr" && wa.qr ? `<div class="note">Телефон → WhatsApp → Связанные устройства → Привязать:</div><img src="${wa.qr}" alt="QR-код WhatsApp" style="background:#fff;padding:8px;border-radius:8px;width:220px">`
      : `<div class="muted">Запуск… ${esc(wa.state || "")}</div>`;
    conns = `<div><label class="lbl">✉️ Почта</label>${c.email.map((a) => `<div class="li"><span>${esc(a.name)} · ${esc(a.address)}</span><button aria-label="Удалить ящик" onclick="cAct('email_delete',{address:'${esc(a.address)}'})">✕</button></div>`).join("")}
        <div class="row"><input id="emAddr" placeholder="адрес@gmail.com"><input id="emPwd" type="password" placeholder="пароль приложения"></div>
        <button class="btn ghost" style="margin-top:6px" onclick="cAct('email_add',{name:v('emAddr'),address:v('emAddr'),password:v('emPwd')})">Подключить ящик</button>
        <div class="note">Gmail: myaccount.google.com/apppasswords — пароль приложения из 16 букв.</div></div>
      <div><label class="lbl">✈️ Telegram (ваш аккаунт — чтение чатов)</label>${tgBody}</div>
      <div><label class="lbl">💬 WhatsApp</label>${waBody}</div>
      <div><label class="lbl">▶️ YouTube ${c.youtube.has_key ? "· ключ сохранён" : ""}</label><div class="row"><input id="ytCh" value="${esc(c.youtube.channels.join(", "))}" placeholder="@канал"><input id="ytKey" type="password" placeholder="API-ключ"></div>
        <button class="btn ghost" style="margin-top:6px" onclick="cAct('youtube',{channels:v('ytCh').split(','),api_key:v('ytKey')})">Сохранить</button></div>
      <div><label class="lbl">📅 Календарь iCal · подключено: ${c.calendar.count}</label><div class="row"><input id="calUrl" type="password" placeholder="секретная ссылка .ics"><button class="btn ghost" onclick="cAct('calendar_add',{url:v('calUrl')})">Добавить</button></div></div>`;
  }
  $("#setBody").innerHTML = sec("secKeys", "Ключи API", keys) + sec("secPersona", "Характер", persona) + sec("secLook", "Внешний вид", look) +
    sec("secVoice", "Голос", voice) + sec("secBot", "Telegram-бот", bot) + sec("secModes", "Режимы и функции", modes) + sec("secConn", "Подключения", conns);
}

// ================= first run =================
let onbStep = 0;
function renderOnb() {
  if (!V) return;
  const k = V.keys, steps = `<div class="steps">${[0, 1, 2].map((i) => `<i class="${i <= onbStep ? "on" : ""}"></i>`).join("")}</div>`;
  const pages = [
    `<h2 id="onbTitle">Добро пожаловать, сэр</h2>
     <div class="note" style="font-size:14px">Два бесплатных ключа — и Джарвис работает в облаке, не занимая видеокарту. Можно пропустить и добавить позже в ⚙.</div>
     <div><label class="lbl">Groq — речь и мозг · <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a> ${keyState(k.groq)}</label>
       <div class="keyrow"><input id="oGroq" type="password" placeholder="gsk_…" autocomplete="off"><button class="btn" onclick="saveKey('groq','oGroq')">Сохранить</button></div></div>
     <div><label class="lbl">Gemini — зрение и перевод экрана · <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> ${keyState(k.gemini)}</label>
       <div class="keyrow"><input id="oGem" type="password" placeholder="AIza…" autocomplete="off"><button class="btn" onclick="saveKey('gemini','oGem')">Сохранить</button></div></div>`,
    `<h2 id="onbTitle">Характер и голос</h2>
     <div class="row" style="flex-wrap:wrap">${PERSONAS.map(([id, t]) => `<button class="btn ${V.persona === id ? "" : "ghost"}" onclick="setPersona('${id}')">${t}</button>`).join("")}</div>
     <div><label class="lbl">Синтезатор</label><select onchange="setVal('voice','tts_engine_ru',this.value)">
       <option value="piper" ${V.voice?.engine === "piper" ? "selected" : ""}>Piper — офлайн, мгновенно</option>
       <option value="edge" ${V.voice?.engine === "edge" ? "selected" : ""}>Microsoft Neural — живее, нужен интернет</option></select></div>
     <div class="row"><button class="btn ghost" onclick="api('/api/say','POST',{text:'Привет, сэр. Что будем делать?'})">▶ Послушать</button>
       <button class="btn ghost" onclick="api('/api/voice/enroll','POST');toast('Читайте текст в карточке справа')">🎙 Запомнить мой голос</button></div>
     <div class="note">«Запомнить мой голос» — 20 секунд чтения вслух. После этого Джарвис слушается только вас и его можно перебить.</div>`,
    `<h2 id="onbTitle">Внешний вид</h2>
     <div class="swatches">${Object.entries(ACCENTS).map(([id, rgb]) => `<button class="${V.ui.accent === id ? "on" : ""}" style="background:rgb(${rgb});color:rgb(${rgb})" aria-label="${ACCENT_NAMES[id]}" title="${ACCENT_NAMES[id]}" onclick="setVal('ui','accent','${id}')"></button>`).join("")}</div>
     <div><label class="lbl">Свой фон: видео .mp4/.webm или картинка (необязательно)</label><input type="file" accept="video/mp4,video/webm,image/*" onchange="uploadBg(this)" style="padding:6px"></div>
     <div class="note">Подсказки: скажите «Эй, Джарвис». Начните печатать в любом месте окна. «/» — разделы. Ctrl+Alt+Space — капсула поверх игр.</div>`,
  ];
  $("#onbBody").innerHTML = steps + pages[onbStep] + `<div class="nav">
      <button class="btn ghost" onclick="${onbStep ? "onbGo(-1)" : "onbDone()"}">${onbStep ? "Назад" : "Пропустить"}</button>
      <button class="btn" onclick="${onbStep < 2 ? "onbGo(1)" : "onbDone()"}">${onbStep < 2 ? "Дальше" : "Готово"}</button></div>`;
}
window.onbGo = (d) => { onbStep = Math.max(0, Math.min(2, onbStep + d)); renderOnb(); };
window.onbDone = async () => { $("#onb").hidden = true; await api("/api/settings", "POST", { section: "ui", key: "onboarded", value: true }); toast("Готово, сэр"); };
function maybeOnboard() { if (V && !V.onboarded && $("#onb").hidden) { $("#onb").hidden = false; renderOnb(); } else if (!$("#onb").hidden) renderOnb(); }

// ================= keyboard =================
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeAll(); q.blur(); q.value = ""; renderSugg(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "k") { e.preventDefault(); q.focus(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "h") { e.preventDefault(); openDrawer("history"); return; }
  if (e.ctrlKey && e.key === ",") { e.preventDefault(); openDrawer("settings"); return; }
  const typing = document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (!typing && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) q.focus();
});

// ================= data & live events =================
async function loadV3() { V = await api("/api/v3"); applyLook(); renderHeader(); renderSettings(); maybeOnboard(); }
async function loadState() { state = await api("/api/state"); history = state.history || []; game = !!state.game?.on; setStatus(state.status); renderTasks(); }
let refreshT;
function refreshSoon() { clearTimeout(refreshT); refreshT = setTimeout(async () => { const h = history; await loadState(); history = h; }, 250); }
const AUTO_CARD = { "tasks.json": "tasks", "notes.md": "notes", "reminders.json": "reminders" };
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "level") { lvTarget = Math.min(1, ev.v / 1400); if (ev.s !== status) setStatus(ev.s); }
    else if (ev.type === "status") setStatus(ev.state);
    else if (ev.type === "message") {
      history.push(ev); if (history.length > 200) history.shift();
      sub(ev.role, ev.text); if (ev.role === "user") lastAct = Date.now();
      if ($("#history").classList.contains("open")) renderHistory();
    }
    else if (ev.type === "heard" && !ev.ok) { $("#you").textContent = "не разобрал: " + ev.text; $("#you").classList.remove("fade"); }
    else if (ev.type === "data") { refreshSoon(); if (AUTO_CARD[ev.file] && Date.now() - lastAct < 15000) setTimeout(() => PANELS[AUTO_CARD[ev.file]](), 400); }
    else if (ev.type === "settings" || ev.type === "v3" || ev.type === "macros" || ev.type === "focus" || ev.type === "translate_live" || ev.type === "remote") { loadV3(); if (ev.type === "settings") refreshSoon(); }
    else if (ev.type === "profiles") { if ($("#settings").classList.contains("open")) loadProfiles(); }
    else if (ev.type === "connections") { if ($("#settings").classList.contains("open")) loadConn(); }
    else if (ev.type === "game") { game = ev.on; setStatus(); toast(ev.on ? "🎮 Игровой режим: " + ev.name : "Игровой режим выключен"); }
    else if (ev.type === "cloud" && !ev.ok) { toast("Нет связи с облаком: " + (ev.error || "")); loadV3(); }
    else if (ev.type === "vision") card("vision", "Смотрю на экран", `<img src="data:image/png;base64,${ev.thumb}" alt="" style="width:100%;border-radius:8px;border:1px solid var(--line);display:block"><div class="chip" style="margin-top:6px">${esc(ev.title)}</div>`, 20000);
    else if (ev.type === "card") card("c_" + (ev.title || "").replace(/[^0-9a-zа-яё]/gi, "").slice(0, 20), ev.title || "", `<div class="pre">${esc(ev.text)}</div>`, ev.ttl || 0);
    else if (ev.type === "translation") card("translation", "Перевод · " + (ev.title || "окно"), `<div class="pre">${esc(ev.text)}</div>`, 0);
    else if (ev.type === "enroll") {
      if (ev.state === "on") card("enroll", "Запоминаю ваш голос", `<div style="font-size:15px;line-height:1.5">Привет, Джарвис. Сегодня я хочу спокойно закончить дела, а вечером немного поиграть. Напомни мне купить хлеб и позвонить маме. Какая завтра погода? (А теперь тише:) Джарвис, который час?</div>
        <div style="height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:10px"><div style="height:100%;width:${Math.min(100, Math.round(100 * ev.seconds / ev.need))}%;background:rgb(var(--accent));border-radius:3px"></div></div><div class="chip" style="margin-top:4px">${ev.seconds} из ${ev.need} с речи</div>`, 0);
      else card("enroll", ev.ok ? "Голос запомнен" : "Не получилось", ev.ok ? "<div>Теперь Джарвис слушается только вас.</div>" : "<div>Мало речи — попробуйте ещё раз.</div>", 9000);
    }
    else if (ev.type === "record") { if (ev.state === "on") card("rec", "● Запись", `<div>Идёт запись${ev.seconds ? " · " + ev.seconds + " с" : ""}. Скажите «стоп».</div>`, 0); else { card("rec", "Запись сохранена", `<div class="muted">${esc(ev.name || "")}</div>`, 8000); refreshSoon(); } }
  };
  ws.onclose = () => { setStatus("starting"); setTimeout(() => { connect(); loadState(); loadV3(); }, 2000); };
}
loadState().then(() => {
  const last = history.filter((m) => m.role !== "user").slice(-1)[0];
  if (last) { $("#him").textContent = last.text; $("#him").classList.add("fade"); }
  connect();
});
loadV3();
setInterval(renderTasks, 60000);
</script>
</body>
